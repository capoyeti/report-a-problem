name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - 'test/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'dist/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: report-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: git diff --check HEAD^ HEAD

  build:
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # dist/ is committed because consumers install a tag tarball with no build
      # step. A dirty dist/ here means someone edited src/ and did not rebuild.
      - run: git diff --exit-code dist

  smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: bash scripts/smoke-tarball.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
