<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>report-a-problem panel harness</title>
    <link rel="stylesheet" href="/dist/style.css" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; color: #18181b; }
      .page { padding: 48px 32px; max-width: 720px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #52525b; line-height: 1.5; }
      .trigger { margin-top: 20px; padding: 8px 16px; font: inherit; font-size: 14px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff; cursor: pointer; }
    </style>
    <script src="/vendor/react.js"></script>
    <script src="/vendor/react-dom.js"></script>
    <script src="/vendor/html2canvas.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "/shim/react.js",
          "react/jsx-runtime": "/shim/jsx-runtime.js",
          "react-dom/client": "/shim/react-dom-client.js",
          "lucide-react": "/shim/lucide-react.js",
          "html2canvas": "/shim/html2canvas.js"
        }
      }
    </script>
  </head>
  <body>
    <div class="page">
      <h1>Report a problem, panel harness</h1>
      <p>
        This page exists so the panel can be driven headed against the built package
        with no app around it. The two endpoints below are mocked by the verify script.
      </p>
      <div id="root"></div>
    </div>
    <script type="module">
      import { createElement as h } from 'react';
      import { createRoot } from 'react-dom/client';
      import { ReportProblemProvider, useReportProblem } from '/dist/index.js';

      const endpoints = { report: '/mock/report', attachment: '/mock/attachment' };

      function Trigger() {
        const { open, enabled } = useReportProblem();
        if (!enabled) return null;
        return h('div', null,
          h('button', { className: 'trigger', onClick: open, 'data-testid': 'harness-trigger' }, 'Report a problem'),
          h('button', { className: 'trigger', onClick: open, 'data-testid': 'harness-collapsed' }, 'Report')
        );
      }

      function Harness() {
        const [config, setConfig] = window.React.useState({ enabled: true, availability: undefined, scope: 'tenant:actor:profile', endpoints });
        window.rapHarness = {
          current: window.rapHarness?.current,
          set: (patch) => setConfig((prev) => ({ ...prev, ...patch })),
          availability: (mode, retrying = false) => setConfig((prev) => ({ ...prev, availability: {
            canSubmit: mode === 'ready' || mode === 'checking',
            message: mode === 'ready' ? undefined : mode === 'checking'
              ? "We're checking reporting availability. Your description will stay here while you retry."
              : 'Reporting is temporarily unavailable. Your description will stay here while you retry.',
            retrying,
            onRetry: () => { window.rapRetries = (window.rapRetries || 0) + 1; window.rapHarness.availability('ready'); },
          } })),
        };
        window.React.useEffect(() => { window.rapHarness.current = config; }, [config]);
        return h(ReportProblemProvider, { ...config, key: config.scope }, h(Trigger));
      }
      createRoot(document.getElementById('root')).render(h(Harness));
    </script>
  </body>
</html>
